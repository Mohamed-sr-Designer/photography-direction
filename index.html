<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Estate Photography Direction</title>
<meta name="description" content="Photography direction for real estate development. Four sections, 36 photos each, 144 per project.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C1B2E">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="scrollbar" aria-hidden="true"><div class="scrollbar__fill" id="progress"></div></div>

<header class="nav" id="nav">
  <div class="nav__in">
    <a class="nav__brand" href="#top" aria-label="Top">
      <img src="assets/img/logo.svg" alt="" width="253" height="44">
    </a>
    <nav class="nav__links" id="navLinks" aria-label="Sections"></nav>
    <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span>
    </button>
  </div>
</header>

<div class="drawer" id="drawer"><ul class="drawer__list" id="drawerList"></ul></div>

<main id="top">

  <section class="hero">
    <div class="hero__bg" aria-hidden="true"><div class="hero__grid"></div></div>
    <div class="hero__in">
      <span class="hero__kick" id="heroKick"></span>
      <h1 class="hero__h1">Photography<br><span class="is-accent">Direction</span></h1>
      <p class="hero__lede" id="heroLede"></p>

      <div class="herofoot">
        <div class="hratios">
          <h2 class="hratios__h">Ratios</h2>
          <div class="hratios__row" id="ratios"></div>
          <p class="hratios__note">Every hero subject in all five. Shot on location, not cropped after. The five are counted inside every formula.</p>
        </div>
        <div class="hcast">
          <h2 class="hratios__h">Casting</h2>
          <p class="hcast__b" id="casting"></p>
        </div>
      </div>
    </div>
  </section>

  <div id="sections"></div>

  <section class="sec sec--dark" id="rules">
    <div class="shell">
      <div class="rules">
        <div class="rules__col">
          <h2 class="rules__h">Light</h2>
          <ul class="light" id="light"></ul>
        </div>
        <div class="rules__col">
          <h2 class="rules__h">Deliver</h2>
          <ul class="list" id="deliver"></ul>
        </div>
      </div>

      <div class="total" id="total"></div>
    </div>
  </section>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
